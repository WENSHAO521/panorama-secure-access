display_name: Panorama Secure Access

packager: Panorama Scholarly Group
packagerEmail: psa@panorama-sg.com
license: Other

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

requires:
  - libsecret

# rpmbuild's find-debuginfo and brp-strip rewrite the Core, and the Helper only
# starts a Core whose SHA256 matches the value built into it.
spec_macros:
  - '%global debug_package %{nil}'
  - '%global __os_install_post %{nil}'

# The Helper unit is written by the app's one-time authorization, not at
# install time. An upgrade rewrites an existing unit for its owner and restarts
# it onto the new binaries, so the new Core's hash needs no new password; the
# command does nothing inside an rpm-ostree scriptlet, where the next boot does.
postinstall_scripts:
  - 'update-desktop-database %{_datadir}/applications &> /dev/null || :'
  - '[ "$1" -gt 1 ] && %{_datadir}/%{name}/panorama-secure-access-helper upgrade >/dev/null 2>&1 || :'

# Only teardown belongs here; the binary is already gone when %postun runs.
# Files left in homes would start or open a binary that no longer exists;
# subscriptions stay, since rpm has no purge. An rpm-ostree scriptlet cannot
# see /var/home, which is why the app offers its own uninstall.
postuninstall_scripts:
  - '[ "$1" = 0 ] || exit 0'
  - 'systemctl disable --now panorama-secure-access-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/panorama-secure-access-helper.service /etc/polkit-1/rules.d/49-panorama-secure-access-helper.rules'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'
  - 'getent passwd | while IFS=: read -r _ _ uid _ _ home _; do [ "$uid" -ge 1000 ] 2>/dev/null && [ -d "$home" ] || continue; rm -rf "$home/.cache/com.panoramasg.secureaccess" "$home/.config/autostart/Panorama Secure Access.desktop" "$home/.local/share/applications/panorama-secure-access-url-handler.desktop"; done; true'

supported_mime_type:
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta

keywords:
  - Panorama Secure Access
  - Clash
  - ClashMeta
  - Proxy

generic_name: Panorama Secure Access

group: Applications/Internet

startup_notify: true

startup_wm_class: com.panoramasg.secureaccess
