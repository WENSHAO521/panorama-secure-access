name: preview-windows

# Manual, Windows-only build for previewing UI changes on a real Windows
# runner (which already has Visual Studio + the C++ workload installed) —
# deliberately separate from build.yaml so a preview never touches tags,
# GitHub Releases, the changelog job, or the Telegram announcement.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-windows:
    runs-on: Windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        run: dart setup.dart windows -v

      - name: Dump generated .iss on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Filter *.iss -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Output "===== $($_.FullName) ====="
            Get-Content -Raw -Encoding UTF8 $_.FullName
            Write-Output "===== end ====="
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: preview-windows
          path: ./dist
