name = "panorama-invite"
main = "src/index.js"
compatibility_date = "2026-11-01"

# `npx wrangler kv namespace create INVITES` prints the id to paste here.
[[kv_namespaces]]
binding = "INVITES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
TOKEN_DAYS = "30"

# Secrets, set with `npx wrangler secret put <NAME>`:
#   SIGNING_KEY  the PKCS#8 private key printed by `npm run keygen`
#   ADMIN_TOKEN  a long random string for the /admin routes
